    label: Page title
    widget: string
  - name: intro
    label: Intro line
    widget: text
    required: false
  - name: navLabel
    label: Show in the top menu as
    widget: string
    required: false
  - name: navOrder
    label: Menu order
    widget: number
    value_type: int
    default: 50
  - name: draft
    label: Hide from the site
    widget: boolean
    default: false
  - name: body
    label: Content
    widget: markdown
- name: settings
  label: Site settings
  files:
  - name: page-headings
    label: Page headings and slideshow
    file: src/data/page-settings.json
    fields:
    - name: peopleHeading
      label: People heading
      widget: string
    - name: researchHeading
      label: Research heading
      widget: string
    - name: labLifeHeading
      label: Lab life heading
      widget: text
      hint: A new line creates a line break in the heading.
    - name: slideshowWidth
      label: Slideshow maximum width (pixels)
      widget: number
      value_type: int
      min: 280
      max: 1000
      step: 10
      default: 420
      hint: The whole slideshow card. Automatically shrinks to fit smaller screens.
    - name: slideshowHeight
      label: Slideshow photo height (pixels)
      widget: number
      value_type: int
      min: 140
      max: 600
      step: 10
      default: 220
      hint: The photo area only; captions and controls sit below. Photos keep their proportions. Small phones cap this at 190px.
  - name: site
    label: Homepage text and contact details
    file: src/data/site.json
    fields:
    - name: name
      label: Lab name
      widget: string
    - name: tagline
      label: Tagline
      widget: string
    - name: headline
      label: Homepage headline
      widget: string
    - name: headlineHighlight
      label: Part of the headline to colour
      widget: string
    - name: kicker
      label: Line above the headline
      widget: string
    - name: lede
      label: Opening paragraph
      widget: text
    - name: affiliations
      label: Affiliation chips
      widget: list
      field:
        name: item
        label: Affiliation
        widget: string
    - name: contact
      label: Contact
      widget: object
      fields:
      - name: piName
        label: PI name
        widget: string
      - name: email
        label: Email
        widget: string
      - name: address
        label: Address lines
        widget: list
        field:
          name: line
          label: Line
          widget: string
      - name: switchboard
        label: Switchboard
        widget: string
    - name: prototypeBanner
      label: Legacy prototype banner (unused)
      widget: boolean
      default: true
      hint: Turn this off on launch day.
