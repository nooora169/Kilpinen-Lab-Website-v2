- name: gallery
  label: Life in the lab
  label_singular: Photo
  folder: src/content/gallery
  create: true
  slug: '{{slug}}'
  identifier_field: caption
  summary: '{{caption}}'
  fields:
  - name: caption
    label: Caption
    widget: string
  - name: photo
    label: Photo
    widget: image
    required: false
    hint: Entries without a photo stay saved but are hidden from the gallery.
  - name: featured
    label: Include in featured slideshow
    widget: boolean
    default: false
    hint: Featured photos also remain in the collage. Sort order sets slideshow order.
  - name: group
    label: Photo group
    widget: string
    required: false
    hint: Give photos the same group name to display them together. Leave blank for the main collage. Sort order arranges groups and photos.
  - name: fit
    label: Image framing
    widget: select
    options:
    - label: Show the whole photograph
      value: contain
    - label: Fill the frame (crop edges)
      value: cover
    default: cover
    hint: Applies to the static collages. Slideshow photos are always shown in full.
  - name: credit
    label: Photo credit
    widget: string
    required: false
  - name: date
    label: Date
    widget: string
    required: false
    pattern: ['^$|^\d{4}(-\d{2})?(-\d{2})?$', 'Use YYYY, YYYY-MM or YYYY-MM-DD.']
    hint: Enables filtering by year. Leave unknown dates empty.
  - name: alt
    label: Image description for accessibility
    widget: string
    required: false
  - name: layout
    label: Photo shape
    widget: select
    options: [landscape, portrait]
    default: landscape
  - name: position
    label: Crop focus
    widget: string
    default: 50% 50%
    hint: Use 50% 25% to keep faces near the top in view
  - name: wide
    label: Wide photo (two columns)
    widget: boolean
    default: false
  - name: order
    label: Sort order
    widget: number
    value_type: int
    default: 50
- name: pages
  label: Other pages
  label_singular: Page
  folder: src/content/pages
  create: true
  slug: '{{slug}}'
