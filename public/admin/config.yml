# Hosted editing still requires repository and OAuth setup; see README.
backend:
  name: github
  repo: YOUR_GITHUB_ORG/YOUR_REPOSITORY
  branch: main
local_backend: true
media_folder: public/uploads
public_folder: /uploads
publish_mode: simple
collections:
- name: topics
  label: Research topics
  label_singular: Research topic
  folder: src/content/topics
  create: true
  slug: '{{slug}}'
  identifier_field: shortName
  summary: '{{shortName}}'
  sortable_fields:
  - order
  - shortName
  fields:
  - name: figures
    label: Results images and figures
    widget: list
    required: false
    hint: Add real results only. Multiple images are supported; empty image entries stay hidden.
    fields:
    - name: image
      label: Image
      widget: image
      required: false
    - name: caption
      label: Caption
      widget: string
    - name: size
      label: Display size
      widget: select
      options:
      - label: Small (logos, up to 280 px)
        value: small
      - label: Medium (up to 640 px)
        value: medium
      - label: Full available width
        value: full
      default: full
      hint: Preserves image proportions; never crops scientific figures.
    - name: placement
      label: Image placement
      widget: select
      default: auto
      options:
      - label: Automatic (original layout)
        value: auto
      - label: Above the text
        value: above
      - label: Left of the text
        value: left
      - label: Right of the text
        value: right
      - label: Below the text
        value: below
      hint: "Side images stack after the text on mobile. Display size is a maximum within the column. Automatic puts the first project image above the text and other images below; topic images go below."
    - name: alt
      label: Image description for accessibility
      widget: string
      required: false
    - name: credit
      label: Credit
      widget: string
      required: false
  - name: funders
    label: Funder logos
    widget: list
    required: false
    fields:
    - name: name
      label: Funder name
      widget: string
    - name: logo
      label: Logo
      widget: image
      required: false
    - name: url
      label: Website
      widget: string
      required: false
  - name: methods
    label: Methods
    widget: list
    required: false
    field:
      name: item
      widget: string
  - name: questions
    label: Research questions
    widget: list
    required: false
    field:
      name: item
      widget: string
  - name: shortName
    label: Short bubble label
    widget: string
  - name: title
    label: Full title
    widget: string
  - name: hook
    label: Brief description
    widget: string
  - name: summary
    label: Summary
    widget: text
  - name: colour
    label: Colour
    widget: select
    options:
    - gfp
    - dapi
    - mcherry
    - farred
    - amber
    - cyan
    - slate
    - chalk
    default: cyan
  - name: status
    label: Status
    widget: select
    options:
    - Active
    - Recruiting
    - Wrapping up
    - Open source
    default: Active
  - name: since
    label: Running since (year)
    widget: string
    required: false
  - name: people
    label: People on this topic
    widget: relation
    collection: people
    search_fields:
    - name
    value_field: '{{slug}}'
    display_fields:
    - name
    multiple: true
    required: false
  - name: dois
    label: Key paper DOIs (just the DOI, nothing else)
    widget: list
    field:
      name: doi
      label: DOI
      widget: string
    required: false
  - name: funding
    label: Funding
    widget: list
    field:
      name: item
      label: Funder and grant number
      widget: string
    required: false
  - name: collaborators
    label: Collaborators outside the group
    widget: list
    field:
      name: item
      label: Name and institution
      widget: string
    required: false
  - name: datasets
    label: Datasets and resources
    widget: list
    required: false
    fields:
    - name: name
      label: Name
      widget: string
    - name: url
      label: Link
      widget: string
      required: false
  - name: order
    label: Sort order
    widget: number
    value_type: int
    default: 50
  - name: draft
    label: Hide from the site
    widget: boolean
    default: false
  - name: body
    label: Extended topic description
    widget: markdown
    required: false
    hint: Appears under More about this topic on the Research page.
